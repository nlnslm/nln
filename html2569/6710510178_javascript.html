<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Test</title>
    <script>
        // Your JavaScript code here
        let message = "Hello, World!";
        alert(message);
        document.write(message);
        document.getElementById("output").innerHTML = message;
        console.log(message);
        function greetUser() {
            const name = prompt("Please enter your name:");
            if (name) {
                alert(`Hello, ${name}! Welcome to our website.`);
            } else {
                alert("Hello! Welcome to our website.");
            }
        }
        let score = parseInt(prompt("Enter your score:"));
        if (score >= 90) {
            console.log("Grade: A");
        } else if (score >= 80) {
            console.log("Grade: B");
        } else if (score >= 70) {
            console.log("Grade: C");
        } else if (score >= 60) {
            console.log("Grade: D");
        } else {
            console.log("Grade: F");
        }
    </script>
</head>
<body>
    <button onclick="greetUser()">What's your name?</button>
    <p id="output">Welcome to my page.</p>
    
</body>
</html>
