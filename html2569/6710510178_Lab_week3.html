<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1 style="text-align: center;">Contact Page</h1>
        <h2>Contact Information</h2>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="contact">
            <h2>Contact Us</h2>
            <p>Please feel free to reach out to us with any questions or concerns.</p>
            <form action="#" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required maxlength="50" title="Please enter your name">
                <br><br>
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" required maxlength="10" pattern="[0-9]{10}" title="Please enter a valid 10-digit phone number">
                <br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required title="Please enter a valid email address">
                <br><br>
                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>
                <br><br>
                <fieldset>
                    <legend>Preferred Contact Method</legend>
                    <input type="radio" id="phone" name="contact" value="phone" checked>
                    <label for="phone">Phone</label>
                    <br>
                    <input type="radio" id="email" name="contact" value="email" checked>
                    <label for="email">Email</label>
                </fieldset>
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Your Company. All rights reserved.</p>
    </footer>
</body>
</html>
