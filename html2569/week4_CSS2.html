<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS2</title>
    <style>
        body {
            font-family: 'Bai Jamjuree', sans-serif;
            background-color: rgb(255, 255, 255);
            color: rgb(0, 0, 0);
            margin: 20px;
        }
        div {
            width: 300px;
            height: 250px;
            background-color: rgb(197, 93, 166);
            padding: 10px;
            margin: 10px 0;
            border-color: rgb(53, 77, 184);
            border-style: solid;
            border-width: 2px;
        }
        #p1 {
            background-color: bisque;
            border-style: double;
            border-width: 2px;
        }
        #div1 {
            width: 300px;
            height: 250px;
            background-color: lightblue;
            padding: 10px;
            margin: 10px 0;
            border-color: rgb(42, 164, 194);
            border-style: solid;
            border-width: 2px;
            margin: 10px;
            padding: 20px;
        }
        #div2 {
            width: 200px;
            height: 250px;
            background-color: rgb(202, 219, 124);
            border-color: rgb(185, 55, 55);
            border-style: solid;
            border-width: 2px;
            margin: 10px;
            padding: 20px;
        }
        .c1 {
            font-size: x-large;
            font-weight: 600;
        }
        .c2 {
            font-size: large;
            font-weight: 300;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&family=Mali:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="c1">
        <p>ฟอนท์ภาษาไทย</p>
    </div>

    <div id="div1" class="c1">
        This is a paragraph inside a div.
    </div>

    <div id="div2" class="c2">
        <p>This is another paragraph inside a different div.</p>
    </div>

    <p id="p1">This is a standalone paragraph.</p>
</body>
</html>
