<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floxbox_try</title>
    <style>
        .container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
            gap: 1rem;
        }
        .container div {
            margin: 10px;
            padding: 20px;
            background-color: #a4c0fc;
            text-align: center;
            border-radius: 5px;
        }
        .navbar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #333;
            padding: 10px;
            color: white;
        }
        .nav-link {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            align-items: left;
        }
        .nav-link li a {
            color: white;
            text-decoration: underline;
            text-decoration: none;
        }
        .nav-link li a:hover {
            background-color: #ddd;
            color: rgb(48, 79, 114);
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div>welcome</div>
        <div>to</div>
        <div>this website</div>
    </div>
    <div class="navbar">
        <ul class="nav-link">
            <li><a href="#Home">Home</a></li>
            <li><a href="#About">About</a></li>
            <li><a href="#Contact">Contact</a></li>
        </ul>
    </div>
    <div class="container">
        <div>
            <p>Hello, World!</p>
        </div>
        <div>
            <p>This is a simple flexbox layout.</p>
        </div>
        <div>follower</div>
    </div>
</body>
</html>
