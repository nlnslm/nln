<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floxbox_try</title>
    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            height: 100vh;
            gap: 1rem;
        }
        .container div {
            margin: 10px;
            padding: 20px;
            background-color: #f0f0f0;
            text-align: center;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>
            <p>Hello, World!</p>
        </div>
        <div>
            <p>This is a simple flexbox layout.</p>
        </div>
        <div>Item1</div>
    </div>
</body>
</html>
