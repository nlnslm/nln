<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Authentication</h3>
    <form action="" method="post">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>
        <input type="submit" value="Login">
        <input type="reset" value="Cancel">
    </form>
    <h3>Input Type Examples</h3>
    <form action="">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>
        <label for="number">Number:</label>
        <input type="number" id="number" name="number" min="1" max="100" required>
        <br><br>
        <label for="website">Website:</label>
        <input type="url" id="website" name="website">
        <br><br>
        <label for="date">Date:</label>
        <input type="date" id="date" name="date">
        <br><br>
        <label for="time">Time:</label>
        <input type="time" id="time" name="time">
        <br><br>
        <label for="color">Color:</label>
        <input type="color" id="color" name="color">
        <input type="hidden" name="hiddenField" value="hiddenValue">
        <br><br>
        <label for="Omeal">Meal:</label><br>
        <input type="checkbox" id="breakfast" name="meal" value="breakfast">ข้าวต้ม<br>
        <input type="checkbox" id="lunch" name="meal" value="lunch">ซุปกระดูกวัว<br>
        <input type="checkbox" id="dinner" name="meal" value="dinner">มาม่า<br>
        <label for="Fmeal">Favorite Meal:</label><br>
        <input type="radio" id="breakfast" name="meal" value="breakfast" required>สลัดผักกุ้งกรอบ<br>
        <input type="radio" id="lunch" name="meal" value="lunch" required>ข้าวแกง<br>
        <input type="radio" id="dinner" name="meal" value="dinner" required>ก๋วยเตี๋ยว<br>
        <label for="file">Choose File:</label>
        <input type="file" id="file" name="file">
        <br><br>
        <label for="Textarea">Textarea:</label>
        <textarea id="Textarea" name="Textarea" rows="4" cols="50"></textarea>
        <br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Cancel">
    </form>
</body>
</html>
