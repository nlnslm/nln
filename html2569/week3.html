<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Details and Summary</h1>
    <details>
        <summary>Click me</summary>
        <h3>Content Title</h3>
        <p>This is the content that will be shown/hidden.</p>
        <div>
            <p>More content can go here.</p>
        </div>
    </details>
    <h1>Detalist</h1>
    <label for="browser">Choose a browser:</label>
    <input type="checkbox" id="browser" name="browser" value="Chrome">
    <label for="browser">Chrome</label>
    <input type="checkbox" id="browser" name="browser" value="Firefox">
    <label for="browser">Firefox</label>
    <input type="checkbox" id="browser" name="browser" value="Safari">
    <label for="browser">Safari</label>
    <input type="checkbox" id="browser" name="browser" value="Edge">
    <label for="browser">Edge</label>
    <datalist id="browsers">
        <option value="Chrome">
        <option value="Firefox">
        <option value="Safari">
        <option value="Edge">
    </datalist>
    <h1>Mark</h1>
    <p>The <mark>highlighted text</mark> is marked for emphasis.</p>
    <h1>Progress</h1>
    <progress value="70" max="100">70%</progress>
    <h1>Meter</h1>
    <meter value="70" min="0" max="100">70%</meter>
    <h1>Time</h1>
    <time datetime="2023-06-01T12:00">June 1, 2023, 12:00 PM</time>
</body>
</html>
