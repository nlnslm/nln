    <script>
           //array of fruits
       fruits = ["Apple", "Papaya", "Banana", "Orange "];
       document.write("<br>Fruits: " + fruits);
       //loop with for loop to display each fruit
       for (let i = 0; i < fruits.length; i++) {
           document.write("<br>Fruit " + (i + 1) + ": " + fruits[i]);
       }
       //loop with while loop to display each fruit
       let i = 0;
       while (i < fruits.length) {
           document.write("<br>Fruit " + (i + 1) + ": " + fruits[i]);
           i++;
       }
       //loop with do while loop to display each fruit
       let j = 0;
       do {
           document.write("<br>Fruit " + (j + 1) + ": " + fruits[j]);
           j++;
       } while (j < fruits.length);
    </script>
